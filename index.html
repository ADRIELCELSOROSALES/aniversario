    <defs>
      <clipPath id="recorte-corazon" clipPathUnits="objectBoundingBox">
        <path d="M0.5,1 C0.5,1 0.02,0.68 0.02,0.32 C0.02,0.12 0.19,0.01 0.33,0.01
                 C0.42,0.01 0.48,0.06 0.5,0.14 C0.52,0.06 0.58,0.01 0.67,0.01
                 C0.81,0.01 0.98,0.12 0.98,0.32 C0.98,0.68 0.5,1 0.5,1 Z"/>
      </clipPath>
    </defs>
  </svg>

  <div class="atmosfera" aria-hidden="true"></div>
  <canvas id="particulas" aria-hidden="true"></canvas>

  <!-- el contenido lo arma js/escenas.js leyendo js/historia.js -->
  <main></main>

  <!-- la rueda del año -->
  <div class="rueda" aria-hidden="true">
    <svg class="rueda__svg" viewBox="0 0 64 64">
      <circle class="rueda__pista" cx="32" cy="32" r="26"/>
      <circle class="rueda__arco"  cx="32" cy="32" r="26"/>
      <g>
        <circle class="rueda__marca" cx="32" cy="6"  r="2.6"/>
        <circle class="rueda__marca" cx="58" cy="32" r="2.6"/>
        <circle class="rueda__marca" cx="32" cy="58" r="2.6"/>
        <circle class="rueda__marca" cx="6"  cy="32" r="2.6"/>
      </g>
      <text class="rueda__txt" x="32" y="35"></text>
    </svg>
  </div>

  <!-- música -->
  <button class="musica" type="button" aria-pressed="false" aria-label="Activar o desactivar la música">
    <span class="musica__ondas" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="musica__label">sin música</span>
  </button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
